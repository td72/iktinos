[package]
name = "iktinos-tui"
version = "0.3.1"
description = "The terminal viewer of iktinos, as a library: the `iktinos` command is in the `iktinos` crate"
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
iktinos-core.workspace = true
ratatui = "0.30"
serde = { workspace = true, features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
toml = { version = "1.2", default-features = false, features = ["parse"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
iktinos-live.workspace = true

[lints]
workspace = true
