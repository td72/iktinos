name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy, rustfmt

      - uses: j178/prek-action@v3.1.0

  test:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: ${{ matrix.target }}

      - name: cargo test
        run: cargo test --workspace --all-features --target ${{ matrix.target }}

      - name: cargo build
        run: cargo build --workspace --target ${{ matrix.target }}

  # The page of `iktinos serve` (crates/iktinos-web/web): checked, built, and
  # the server tested with it embedded. The other jobs build without Node and
  # so embed the placeholder page.
  web:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Node, as mise.toml says.
      - uses: jdx/mise-action@v5.2.9

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1

      - name: Format, lint and type-check the page
        run: mise run web:check

      - name: Build the page
        run: mise run web:build

      - name: Test the server with the page embedded
        run: cargo test -p iktinos-web --all-features

      - name: The package holds the page
        run: cargo package --list -p iktinos-web --allow-dirty | grep -qx 'web/dist/index.html'
