[workspace]
resolver = "2"
members = ["crates/*"]

# Every crate inherits these; a version is bumped per crate (core, live, tui
# and the command move at different speeds), everything else is shared.
[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["td72"]
repository = "https://github.com/td72/iktinos"
keywords = ["claude-code", "claude", "agents", "sessions", "transcript"]
categories = ["development-tools", "parser-implementations"]

[workspace.dependencies]
iktinos-core = { path = "crates/iktinos-core", version = "0.3.1" }
iktinos-live = { path = "crates/iktinos-live", version = "0.3.0" }
iktinos-web = { path = "crates/iktinos-web", version = "0.1.0" }
iktinos-tui = { path = "crates/iktinos-tui", version = "0.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
all = "warn"
